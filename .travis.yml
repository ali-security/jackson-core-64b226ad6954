language: java
# core streaming still builds on jdk6 and above:
# 05-Jan-2018, tatu: Not sure why, but travis build fails on jdk6 so leave it out
# Sealed build: Travis no longer provisions openjdk7, so the JDK 7 leg downloads
# Azul Zulu 7 in .travis/seal-setup.sh; the JDK 8 leg uses the image's openjdk8.
dist: focal

jobs:
  include:
    - jdk: openjdk8
      env: SEAL_JDK=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
    - jdk: openjdk8

before_install: source .travis/seal-setup.sh

install: true

script:
  - mvn -B -V -e -ntp test
  - python3 .travis/surefire-summary.py

after_script: bash .travis/wait-for-log.sh
